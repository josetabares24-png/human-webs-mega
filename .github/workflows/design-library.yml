name: Design memory
on:
  pull_request:
    paths:
      [
        "design-library/**",
        "tools/design-library/**",
        ".github/workflows/design-library.yml",
      ]
  push:
    branches: [main, feat/instant-web-builder-mvp]
    paths:
      [
        "design-library/**",
        "tools/design-library/**",
        ".github/workflows/design-library.yml",
      ]
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: node --check tools/design-library/query.mjs
      - run: node tools/design-library/query.mjs --check
      - run: node tools/design-library/query.mjs carbone --recipe
