name: Bocumo preview
on:
  pull_request:
    paths: ["examples/bocumo/**", ".github/workflows/bocumo.yml"]
  push:
    branches: [main, feat/instant-web-builder-mvp]
    paths: ["examples/bocumo/**", ".github/workflows/bocumo.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm --prefix examples/bocumo run check
      - run: npm --prefix examples/bocumo run build
