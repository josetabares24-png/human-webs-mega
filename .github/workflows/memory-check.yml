name: Master memory validation
on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "memory/**"
      - "design-library/**"
      - "tools/design-library/**"
      - "prompts/bot.md"
      - "archive/**"
      - "tools/memory/**"
      - "tools/copy/**"
      - "tools/sectors/**"
      - "tools/design-preflight/**"
      - "principles/human-copy.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/memory-check.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "memory/**"
      - "design-library/**"
      - "tools/design-library/**"
      - "prompts/bot.md"
      - "archive/**"
      - "tools/memory/**"
      - "tools/design-preflight/**"
      - "tools/sectors/**"
      - "tools/copy/**"
      - ".github/copilot-instructions.md"
      - ".github/workflows/memory-check.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: node --version
      - run: node --check tools/memory/check.mjs
      - run: node tools/memory/check.mjs
      - run: node --check tools/design-library/query.mjs
      - run: node tools/design-library/query.mjs --check
      - run: node --check tools/design-preflight/check.mjs
      - run: node --test tools/design-preflight/check.test.mjs
      - run: node tools/design-preflight/check.mjs tools/design-preflight/fixtures/good-new.json
      - run: node --check tools/sectors/check.mjs
      - run: node tools/sectors/check.mjs
      - run: node --check tools/copy/lint.mjs
      - run: node --test tools/copy/lint.test.mjs
      - run: node tools/copy/lint.mjs --lang pt-PT --strict tools/copy/fixtures/good-pt.md
